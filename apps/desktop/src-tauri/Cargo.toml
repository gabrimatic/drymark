[package]
name = "drymark-desktop"
description = "DryMark desktop tray application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "drymark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "drymark-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomic-write-file = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-global-shortcut = "2.3.2"
drymark-core = { path = "../../../crates/drymark-core" }
drymark-transaction = { path = "../../../crates/drymark-transaction" }
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true

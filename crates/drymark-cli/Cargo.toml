[package]
name = "drymark-cli"
description = "Local, deterministic removal of inspectable hidden LLM watermark channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "drymark"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
drymark-core = { path = "../drymark-core" }
zeroize = "1.8"

[dev-dependencies]
assert_cmd = "2.0"

[lints]
workspace = true

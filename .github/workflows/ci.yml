name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify source setup and public repository surface
        run: |
          bash scripts/setup.test.sh
          bash scripts/check-public-tree.test.sh
          node scripts/check-readme-media.test.mjs
          bash scripts/check-public-tree.sh
      - run: npm run lint:ui
      - run: npm run test:ui
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Verify Windows setup entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.test.ps1

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-10
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Verify the fuzz lockfile
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Exercise sanitizer invariants
        run: cargo +nightly-2026-08-10 fuzz run sanitize -- -runs=10000 -max_len=4096
      - name: Exercise transaction state machine
        run: cargo +nightly-2026-08-10 fuzz run transaction -- -runs=10000 -max_len=4096

  security:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo audit
      - run: cargo deny check

  mutation:
    name: Core mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - run: cargo install cargo-mutants --version 27.1.0 --locked
      - run: cargo metadata --locked --format-version 1 > /dev/null
      - run: cargo mutants -p drymark-core --jobs 4 --timeout 60 --cargo-arg=--locked

  desktop:
    name: Desktop compile (${{ matrix.os }})
    needs: [frontend, rust, fuzz, security, mutation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm ci
      - name: Check source setup
        if: runner.os != 'Windows'
        run: ./setup.sh --check
      - name: Check source setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\setup.ps1 -Check
      - run: cargo metadata --locked --no-deps --format-version 1
      - name: Compile native desktop application
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Build and verify macOS application bundle
        if: runner.os == 'macOS'
        run: |
          npm run tauri -- build --bundles app -- --locked
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/DryMark.app
      - name: Build and inspect Linux Debian package
        if: runner.os == 'Linux'
        run: |
          npm run tauri -- build --bundles deb -- --locked
          dpkg-deb --info target/release/bundle/deb/*.deb
      - name: Build and inspect Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis -- --locked
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -le 0) {
            throw "Expected one non-empty DryMark NSIS installer."
          }

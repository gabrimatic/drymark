name: Fuzz

on:
  pull_request:
    paths:
      - "crates/drymark-core/**"
      - "crates/drymark-transaction/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: AddressSanitizer fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-08-10
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Fuzz sanitizer invariants
        working-directory: fuzz
        run: cargo +nightly-2026-08-10 fuzz run sanitize -- -max_total_time=60 -timeout=5 -rss_limit_mb=2048
      - name: Fuzz clipboard transactions
        working-directory: fuzz
        run: cargo +nightly-2026-08-10 fuzz run transaction -- -max_total_time=60 -timeout=5 -rss_limit_mb=2048

name: Feature request
description: Propose a focused policy, platform, CLI, or UX improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete hidden channel or user workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Appearance and language trade-offs
      description: Explain possible emoji, script shaping, directionality, or formatting impact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References or synthetic examples
      description: Use U+XXXX notation and do not include private text.
